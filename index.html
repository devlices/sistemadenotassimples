<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="titulo">
        <header>
            <h1> Sistema de Notas </h1>
        </header>
    </section>
    
    <!-- Resultado mantido no topo, logo abaixo do título -->
    <div id="resultado" class="resultado">
        <p>Preencha os dados e clique em calcular.</p>
    </div>
    
    <!-- Campo do Nome -->
    <div id="infos" class="infos">
        <label for="nome">Insira seu nome</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
    </div>
    
    <!-- Campo das Notas com o texto adicionado -->
    <div class="notas">
        <label for="nota1">Coloque suas notas</label>
        <input type="number" id="nota1" step="0.1" placeholder="Digite a nota 1">
        <input type="number" id="nota2" step="0.1" placeholder="Digite a nota 2">
    </div>

    <!-- Botão -->
    <section>
        <button id="calculomedia" class="calculomedia">Calcular Média</button>
    </section>

    <script src="javascript.js"></script>
</body>
</html>
